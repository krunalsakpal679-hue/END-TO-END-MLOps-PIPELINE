name: Deploy to Staging & Production

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
        description: 'Docker image tag to deploy'

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/anti-gravity-api

jobs:
  # ──────────────────────────────────────────────
  # Job 1 — Deploy to Staging (Simulated)
  # ──────────────────────────────────────────────
  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulated staging deployment
        run: |
          echo "Connecting to staging environment (simulation)..."
          echo "Pulling image: ${{ env.IMAGE_BASE }}:${{ inputs.image_tag }}"
          echo "Restarting services..."
          echo "Deployment pipeline successful"
          echo "Staging deployment simulation complete"

      - name: Run simulated smoke tests
        run: |
          echo "Running smoke tests against staging endpoint..."
          echo "HTTP GET /health -> 200 OK"
          echo "Model inference check -> Passed"
          echo "Smoke tests successful"

      - name: Skip Slack notification
        run: |
          echo "Slack integration disabled (Portfolio mode)"

  # ──────────────────────────────────────────────
  # Job 2 — Deploy to Production (Simulated)
  # ──────────────────────────────────────────────
  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy_staging]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulated production deployment (Blue-Green)
        run: |
          echo "Starting Blue-Green deployment simulation..."
          echo "Deploying version: ${{ inputs.image_tag }}"
          echo "Warming up new containers..."
          echo "Health check PASSED (HTTP 200)"
          echo "Switching traffic from Green to Blue..."
          echo "Production deployment simulation complete"

      - name: Create GitHub Deployment record
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: `Simulated deployment of image tag: ${{ inputs.image_tag }}`
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: '${{ vars.PRODUCTION_URL }}',
              description: 'Simulated deployment completed successfully'
            });

      - name: Skip Slack notification
        run: |
          echo "Slack integration disabled (Portfolio mode)"
