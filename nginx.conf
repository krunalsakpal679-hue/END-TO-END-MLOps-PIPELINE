# ==============================================================================
# Nginx Configuration for MLflow Reverse Proxy
# ==============================================================================
# What this file does:
# 
# 1. Global Setup (events/http blocks): Sets up connection handling and logging formats.
#    We define a custom log format called 'mlflow_log' that tracks the timestamp,
#    authenticated user, HTTP method, requested URL, response status, and request time.
#
# 2. Rate Limiting (limit_req_zone): Creates a memory zone tracking request rates by 
#    client IP, restricting traffic to exactly 30 requests per minute to prevent abuse.
#
# 3. Server Block (server): Defines the main entrypoint listening on port 80 (HTTP).
#    (An SSL block is included but commented out for future HTTPS implementation).
#
# 4. Security Headers (add_header): Injects standard web security headers to prevent
#    clickjacking, content sniffing, and cross-site scripting (XSS) attacks.
#
# 5. Access Control (auth_basic): Locks the entire server behind HTTP Basic Auth,
#    checking credentials against the /etc/nginx/.htpasswd file.
#
# 6. Read-Only Enforcement (if conditions): Inspects the authenticated username and
#    the HTTP method. If the user is 'readonly' and tries to modify data 
#    (POST, PUT, DELETE, PATCH), they are immediately rejected with a 403 Forbidden.
#
# 7. Reverse Proxy (location /): Forwards all traffic securely to the internal MLflow
#    server running on port 5000, passing along necessary real IP headers.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Custom log format to include authenticated user and response time
    log_format mlflow_log '[$time_local] user="$remote_user" method="$request_method" '
                          'path="$uri" status=$status time=$request_time';

    access_log /var/log/nginx/mlflow_access.log mlflow_log;
    error_log /var/log/nginx/mlflow_error.log;

    # Rate limiting zone: max 30 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=mlflow_limit:10m rate=30r/m;

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # SSL Configuration (Commented out for future implementation)
        # Uncomment and configure these variables when deploying HTTPS certificates
        # ----------------------------------------------------------------------
        # listen 443 ssl;
        # ssl_certificate /etc/ssl/certs/mlflow_cert.crt;
        # ssl_certificate_key /etc/ssl/private/mlflow_key.key;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
        # ----------------------------------------------------------------------

        # Global Security Headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Apply Rate Limiting
        # nodelay ensures instantaneous 429 response if cap is breached
        limit_req zone=mlflow_limit burst=5 nodelay;
        limit_req_status 429;

        # HTTP Basic Authentication
        auth_basic "Restricted MLflow Tracking Server";
        auth_basic_user_file /etc/nginx/.htpasswd; # Mount your .htpasswd file here

        location / {
            # Read-only User Restriction
            # Nginx handles nested logic poorly, so we utilize binary variable mapping
            set $ro_reject 0;
            
            # Condition 1: Is the authenticated user exactly 'readonly'?
            if ($remote_user = "readonly") {
                set $ro_reject 1;
            }
            # Condition 2: Is the HTTP method mutating data?
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                set $ro_reject "${ro_reject}1";
            }
            # Execution: If both are true, kick them out with a 403 Forbidden
            if ($ro_reject = "11") {
                return 403;
            }

            # Proxy Pass to MLflow backend
            proxy_pass http://localhost:5000;  # Modify to your internal MLflow container host if using bridge networks
            
            # Preserve critical reverse-proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
